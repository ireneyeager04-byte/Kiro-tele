name: Build AKRAM TELE independent APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AKRAM TELE configuration
        uses: actions/checkout@v4

      - name: Clone upstream Telegram Android with submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/TelegramMessenger/Telegram-Android.git Telegram
          cd Telegram
          git submodule update --init --recursive --depth=1

      - name: Apply AKRAM TELE identity and side-by-side package ID
        run: |
          cd Telegram
          python3 - <<'PY'
          from pathlib import Path

          # Unique package identifier: does not replace official Telegram.
          p = Path("gradle.properties")
          s = p.read_text()
          s = s.replace("APP_PACKAGE=org.telegram.messenger", "APP_PACKAGE=com.akram.tele")
          if "APP_PACKAGE=com.akram.tele" not in s:
              raise SystemExit("Failed to set independent package ID")
          p.write_text(s)

          # App name branding
          p = Path("TMessagesProj/src/main/res/values/strings.xml")
          s = p.read_text()
          s = s.replace('<string name="AppName">Telegram</string>', '<string name="AppName">AKRAM TELE</string>')
          s = s.replace('<string name="AppNameBeta">Telegram Beta</string>', '<string name="AppNameBeta">AKRAM TELE Beta</string>')
          p.write_text(s)

          # Add a launcher entry inside Telegram's main dialogs menu for local chats.
          dialogs = Path("TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java")
          d = dialogs.read_text()
          marker = "AKRAM_LOCAL_CHATS_MENU_ENTRY"
          insertion = """        // AKRAM_LOCAL_CHATS_MENU_ENTRY
        ActionBarMenuItem akramLocalChatsItem = menu.addItem(991234, android.R.drawable.ic_menu_agenda);
        akramLocalChatsItem.setOnClickListener(v -> {
            Intent localChatsIntent = new Intent(getParentActivity(), AkramLocalChatsActivity.class);
            getParentActivity().startActivity(localChatsIntent);
        });
"""
          if marker not in d:
              needle = "        ActionBarMenu menu = actionBar.createMenu();"
              if needle not in d:
                  raise SystemExit("DialogsActivity menu anchor not found")
              d = d.replace(needle, needle + "\\n" + insertion, 1)
              dialogs.write_text(d)
          if marker not in dialogs.read_text():
              raise SystemExit("AKRAM local chats menu patch failed")

          # Enable Android RTL support for Arabic-capable UI.
          manifest = Path("TMessagesProj/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = m.replace('android:supportsRtl="false"', 'android:supportsRtl="true"')
          manifest.write_text(m)
          if 'android:supportsRtl="true"' not in m:
              raise SystemExit("RTL flag patch failed")
          # Runtime voice recording requires the manifest permission.
          if "android.permission.RECORD_AUDIO" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application', 1)
              manifest.write_text(m)
          activity = '<activity android:name="org.telegram.ui.AkramLocalChatsActivity" android:exported="false" />'
          alias = '''<activity-alias android:name="org.telegram.ui.AkramLocalChatsLauncher" android:targetActivity="org.telegram.ui.AkramLocalChatsActivity" android:label="محادثات AKRAM TELE" android:icon="@drawable/settings_chat" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity-alias>'''
          if "AkramLocalChatsActivity" not in m:
              m = m.replace("</application>", activity + "\\n" + alias + "\\n</application>")
              manifest.write_text(m)
          PY
          grep -q 'APP_PACKAGE=com.akram.tele' gradle.properties
          grep -q 'AppName">AKRAM TELE' TMessagesProj/src/main/res/values/strings.xml


      - name: Apply persistent AKRAM TELE patches and overlays
        run: bash scripts/apply-akram-overlay.sh

      - name: Validate AKRAM TELE source patches
        run: |
          test -f scripts/apply-akram-overlay.sh
          bash -n scripts/apply-akram-overlay.sh
          test -d patches
          test -d overlay
          echo "Persistent patch/overlay scaffold validated."

      - name: Build using upstream Docker build environment
        run: |
          cd Telegram
          docker build -t akram-tele-android-builder .
          docker run --rm -v "$PWD":/home/source akram-tele-android-builder

      - name: Collect APKs
        run: |
          mkdir -p output
          find Telegram/TMessagesProj/build/outputs/apk -type f -name '*.apk' -print0 | while IFS= read -r -d '' f; do
            rel="${f#Telegram/TMessagesProj/build/outputs/apk/}"
            name="${rel//\//-}"
            cp "$f" "output/$name"
          done
          test -n "$(find output -name '*.apk' -print -quit)"
          ls -lah output

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AKRAM-TELE-independent-apks
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download built APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: AKRAM-TELE-independent-apks
          path: apks

      - name: Boot Android 11 emulator and smoke-test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$(find apks -type f -name '*.apk' | grep 'standalone' | head -n 1)"
            test -n "$APK"
            adb install "$APK"
            adb shell pm list packages | grep 'com.akram.tele.web'
            adb shell monkey -p com.akram.tele.web 1
            sleep 10
            if ! adb shell pidof com.akram.tele.web >/dev/null; then
              echo "App process did not remain alive after launch."
              exit 1
            fi
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL'; then
              echo "Fatal crash found in emulator logs."
              exit 1
            fi
            echo "APK installed and launch smoke test completed."
