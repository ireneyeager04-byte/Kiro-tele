name: Build AKRAM TELE base APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AKRAM TELE config
        uses: actions/checkout@v4

      - name: Clone Telegram Android source with submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/TelegramMessenger/Telegram-Android.git Telegram
          cd Telegram
          git submodule update --init --recursive --depth=1

      - name: Apply AKRAM TELE basic branding
        run: |
          cd Telegram
          python3 - <<'PY'
          from pathlib import Path
          p = Path("TMessagesProj/src/main/res/values/strings.xml")
          s = p.read_text()
          s = s.replace('<string name="AppName">Telegram</string>', '<string name="AppName">AKRAM TELE</string>')
          s = s.replace('<string name="AppNameBeta">Telegram Beta</string>', '<string name="AppNameBeta">AKRAM TELE Beta</string>')
          p.write_text(s)
          PY

      - name: Build using upstream Docker environment
        run: |
          cd Telegram
          docker build -t telegram-android-build .
          docker run --rm -v "$PWD":/home/source telegram-android-build

      - name: Collect APK artifacts
        run: |
          mkdir -p output
          find Telegram/TMessagesProj/build/outputs/apk -type f -name '*.apk' -exec cp {} output/ \;
          test -n "$(find output -name '*.apk' -print -quit)"
          ls -lah output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AKRAM-TELE-base-apks
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
